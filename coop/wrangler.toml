# 5락실 네온 레이드 협동 방 서버 (BK 11/14). Workers 무료 플랜 + SQLite 방식 Durable Object.
# 배포: .github/workflows/coop-deploy.yml (main 의 coop/ 가 바뀌면). 비밀 CF_WORKERS_TOKEN, 변수 CF_ACCOUNT_ID 필요.
# 사이트 연결: Pages(5raksil) 설정 > 바인딩 > Durable Object 'COOP' = 이 Worker(raid-coop)의 Room.
name = "raid-coop"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = false

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
