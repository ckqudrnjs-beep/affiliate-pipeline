name: live-sample

# 실사 배경 쇼츠 샘플 (2026-11-18). PR 브랜치에 tools/live_sample/out/ (mp4 + 장면 확인 그림)을 올려 눈으로 확인한다.
# 키가 없는 PR(예: dependabot)은 건너뛴다. main 에는 올리지 않는다(병합 전에 out/ 지움).
on:
  pull_request:
    paths: ["src/pipeline/live.py", "config/stock_scenes.json", "tools/live_sample/*.json", ".github/workflows/live-sample.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sample:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 키 확인
        id: key
        env:
          K: ${{ secrets.PIXABAY_API_KEY }}${{ secrets.PEXELS_API_KEY }}
        run: if [ -n "$K" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "스톡 키 없음 → 건너뜀"; fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.ok
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        if: steps.key.outputs.ok
        with:
          python-version: "3.12"
      - name: 준비
        if: steps.key.outputs.ok
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends fonts-nanum ffmpeg
          pip install -q pillow numpy supertonic==1.3.1
      - uses: actions/cache@v4
        if: steps.key.outputs.ok
        with:
          path: ~/.cache/supertonic3
          key: supertonic-3-v1
      - name: 샘플 만들기
        if: steps.key.outputs.ok
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          PYTHONPATH=src python -c "import pathlib;from pipeline.episodes import render;render(pathlib.Path('tools/live_sample/heating.json'))"
          grep -q credits tools/live_sample/heating.meta.json || { echo "실사 배경 실패 (웹툰으로 바뀜)"; exit 1; }
          mkdir -p tools/live_sample/out
          mv media/youtube/sample-live-heating.mp4 media/youtube/sample-live-heating.check.jpg tools/live_sample/out/
          git checkout -- data 2>/dev/null || true
          git config user.name "live-sample-bot"
          git config user.email "live-sample-bot@users.noreply.github.com"
          git add tools/live_sample
          git commit -q -m "실사 샘플 결과 (확인용, 병합 전 삭제)" && git push -q origin HEAD
