name: raksil-shorts

# 5락실 채널: 오늘의 밸런스게임 쇼츠를 매일 자동으로 만들어 바로 공개 업로드 (2026-11-13 BK 요청).
# 상품·협찬 없음 → 유료 프로모션 아님. AI 음성이면 합성 콘텐츠 표시 자동.
# 저장소 변수 RAKSIL_YT_ENABLED=true 전에는 만들기만 하고 영상은 Actions 아티팩트로만 남긴다.
on:
  schedule:
    - cron: "43 8 * * *"   # 17:43 KST (저녁 시청 시간 전에 공개, 정각은 GitHub가 자주 밀림)
    - cron: "13 10 * * *"  # 19:13 KST 예비 (이미 올렸으면 건너뜀)
  workflow_dispatch:
    inputs:
      date:
        description: "날짜 YYYY-MM-DD (비우면 오늘)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: main-writer
  cancel-in-progress: false

jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 준비
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q fonts-nanum ffmpeg
          pip install -q pillow numpy supertonic==1.3.1
          mkdir -p "$HOME/fonts"
          curl -sfL -o "$HOME/fonts/BlackHanSans-Regular.ttf" https://fonts.gstatic.com/s/blackhansans/v24/ea8Aad44WunzF9a-dL6toA8r8nqV.ttf || true
      - uses: actions/cache@v4
        with:
          path: ~/.cache/supertonic3
          key: supertonic-3-v1
      - name: 검사
        run: PYTHONPATH=src python -m unittest tests.test_raksil_shorts
      - name: 만들기 + 올리기
        env:
          RAKSIL_YT_ENABLED: ${{ vars.RAKSIL_YT_ENABLED }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          RAKSIL_YT_REFRESH_TOKEN: ${{ secrets.RAKSIL_YT_REFRESH_TOKEN }}
        run: |
          export RAKSIL_FONT="$HOME/fonts/BlackHanSans-Regular.ttf"
          PYTHONPATH=src python -m pipeline.raksil_shorts upload ${{ inputs.date }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raksil-short
          path: media/raksil/
          retention-days: 7
      - name: 틱톡용으로 보관 (릴리스 raksil-shorts, 최근 14개)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls media/raksil/*.mp4 >/dev/null 2>&1 || exit 0
          gh release view raksil-shorts >/dev/null 2>&1 || gh release create raksil-shorts --title "5락실 쇼츠 (틱톡 재업로드용)" --notes "매일 18:00 KST 자동 추가. 최근 14개만 보관. mp4 + 같은 이름 .txt(틱톡 설명)." --latest=false
          for j in media/raksil/*.json; do
            python -c "import json,sys;m=json.load(open(sys.argv[1]));print(m['title'].replace('#shorts','').strip()+'\n\n오늘의 밸런스게임 투표: 프로필 링크 5raksil.com\n#밸런스게임 #너라면 #5락실'+('\nAI 음성' if m.get('voiced') else ''))" "$j" > "${j%.json}.txt"
          done
          gh release upload raksil-shorts media/raksil/*.mp4 media/raksil/*.txt --clobber
          gh release view raksil-shorts --json assets -q '.assets[].name' | sort | grep -E '^[0-9]{4}-' | cut -c1-10 | sort -u | head -n -14 | while read d; do
            for a in $(gh release view raksil-shorts --json assets -q ".assets[].name" | grep "^$d"); do gh release delete-asset raksil-shorts "$a" -y; done
          done
      - name: 업로드 기록 저장
        if: always()
        run: |
          [ -f data/youtube/raksil_uploaded.json ] || exit 0
          git config user.name "raksil-bot"
          git config user.email "raksil-bot@users.noreply.github.com"
          git add data/youtube/raksil_uploaded.json
          git commit -m "5락실 쇼츠 업로드 기록 $(TZ=Asia/Seoul date '+%F')" || exit 0
          git pull --rebase -q origin main
          git push origin HEAD:main
