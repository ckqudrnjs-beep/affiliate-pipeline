name: raksil-shorts

# 5락실 채널: 오늘의 밸런스게임 쇼츠를 매일 자동으로 만들어 바로 공개 업로드 (2026-11-13 BK 요청).
# 상품·협찬 없음 → 유료 프로모션 아님. AI 음성이면 합성 콘텐츠 표시 자동.
# 저장소 변수 RAKSIL_YT_ENABLED=true 전에는 만들기만 하고 영상은 Actions 아티팩트로만 남긴다.
on:
  schedule:
    - cron: "23 7 * * *"   # 16:23 KST 만들기 → 17:00 KST 공개 예약 (BK 11/13: 매일 오후 5시)
    - cron: "47 7 * * *"   # 16:47 KST 예비 (이미 올렸으면 건너뜀, 17시 지나면 바로 공개)
  workflow_dispatch:
    inputs:
      date:
        description: "날짜 YYYY-MM-DD (비우면 오늘)"
        required: false
        default: ""
      range:
        description: "true 면 20시 슬롯을 네온 사격장 하이라이트로 (요일 무관)"
        required: false
        default: "false"
      qid:
        description: "추가 1편: 질문 id (예 20261113-2). 넣으면 그 질문으로 바로 공개, 매일 분과 따로 기록"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: main-writer
  cancel-in-progress: false

jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # 예약 실행이 몇 시간씩 밀려 두 번이 연달아 돌 때, 뒤 실행은 앞 실행이 기록을 푸시하기 전 커밋을 받는다.
      # 그러면 '이미 올림' 검사를 못 하고 같은 쇼츠를 또 올린다 (11/18 중복 2편). 항상 최신 main 기록으로 시작.
      - name: 최신 main 받기
        if: github.ref == 'refs/heads/main'
        run: git fetch -q origin main && git reset -q --hard FETCH_HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 준비
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q fonts-nanum ffmpeg
          pip install -q pillow numpy supertonic==1.3.1 "anthropic>=2.11,<3" kiwipiepy==0.25.1
          mkdir -p "$HOME/fonts"
          curl -sfL -o "$HOME/fonts/BlackHanSans-Regular.ttf" https://fonts.gstatic.com/s/blackhansans/v24/ea8Aad44WunzF9a-dL6toA8r8nqV.ttf || true
      - uses: actions/cache@v4
        with:
          path: ~/.cache/supertonic3
          key: supertonic-3-v1
      - name: 검사
        run: PYTHONPATH=src python -m unittest tests.test_raksil_shorts tests.test_raksil_range tests.test_raksil_games tests.test_raksil_meme tests.test_raksil_kling tests.test_raksil_shorts_legacy tests.test_shorts_lock
      - name: 만들기 + 올리기
        env:
          RAKSIL_YT_ENABLED: ${{ vars.RAKSIL_YT_ENABLED }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          RAKSIL_YT_REFRESH_TOKEN: ${{ secrets.RAKSIL_YT_REFRESH_TOKEN }}
          RAKSIL_QID: ${{ inputs.qid }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # 몽글이의 선택 한 줄 (없으면 '정답은 없다')
          YT_API_KEY: ${{ secrets.YOUTUBE_API_KEY || secrets.YT_API_KEY }}  # 어제 쇼츠 댓글 투표 읽기만 (raksil_shorts.comment_votes)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}  # 품질 게이트 미통과로 쉰 날 알림 (BK 11/20)
          TELEGRAM_ADMIN_CHAT_ID: ${{ vars.TELEGRAM_ADMIN_CHAT_ID }}
          # 형식 고정 스위치: 저장소 변수 RAKSIL_FORMAT. legacy = 11/19 옛 형식 비교(raksil_shorts_legacy),
          # split/quick/versus/result/classic = 그 형식 고정(비교도 멈춤), 비우면 날마다 돌리기 + 11/22~29 격일 비교. RAKSIL_LEGACY_ENDING=on 이면 옛 형식에도 엔딩.
          RAKSIL_FORMAT: ${{ vars.RAKSIL_FORMAT }}
          RAKSIL_LEGACY_ENDING: ${{ vars.RAKSIL_LEGACY_ENDING }}
        run: |
          export RAKSIL_FONT="$HOME/fonts/BlackHanSans-Regular.ttf"
          # 11/22~11/29 은 변수 없이도 격일 비교(옛 형식 11/23·25·27·29). 기준: raksil_shorts_legacy.pick
          FMT=$(PYTHONPATH=src python -m pipeline.raksil_shorts_legacy pick "${{ inputs.date }}")
          if [ "$FMT" = legacy ]; then
            echo "옛 형식(11/19) 비교 편 ($FMT)"
            PYTHONPATH=src python -m pipeline.raksil_shorts_legacy upload ${{ inputs.date }}
          else
            PYTHONPATH=src python -m pipeline.raksil_shorts upload ${{ inputs.date }}
          fi
      - name: 20:00 게임 쇼츠 (새 게임 소개 > 월 네온 사격장 > 목 게임 로테이션)
        if: ${{ inputs.qid == '' || inputs.qid == null }}
        env:
          RAKSIL_YT_ENABLED: ${{ vars.RAKSIL_YT_ENABLED }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          RAKSIL_YT_REFRESH_TOKEN: ${{ secrets.RAKSIL_YT_REFRESH_TOKEN }}
          FORCE: ${{ inputs.range }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # 게임 쇼츠 품질 게이트 채점 (raksil_games.gate)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ vars.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          D="${{ inputs.date }}"; D="${D:-$(TZ=Asia/Seoul date +%F)}"
          PLAN=$(PYTHONPATH=src python -m pipeline.raksil_games plan "$D")
          if [ "$FORCE" = "true" ]; then PLAN=range; fi
          echo "오늘 20시: $PLAN"
          set -- $PLAN
          [ "$1" = none ] && exit 0
          if grep -q "\"$D-range\"\|\"$D-game-" data/youtube/raksil_uploaded.json 2>/dev/null; then echo "이미 올림"; exit 0; fi
          export RAKSIL_FONT="$HOME/fonts/BlackHanSans-Regular.ttf"
          (cd playground && PG_NO_STATS=1 python build.py /tmp/site >/dev/null)
          (cd /tmp/site && python -m http.server 8765 >/dev/null 2>&1 &)
          npm i --no-save --silent playwright@1.63.0 && npx playwright install --with-deps chromium >/dev/null
          if [ "$1" = range ]; then
            STAGE=$(PYTHONPATH=src python -c "import datetime as d;from pipeline.raksil_range import stage_for;print(stage_for(d.date.fromisoformat('$D')))")
            node scripts/range_rec.js http://localhost:8765 /tmp/rec "$STAGE" 21
            PYTHONPATH=src python -m pipeline.raksil_range /tmp/rec upload "$D"
          else
            node scripts/game_rec.js http://localhost:8765 "$2" /tmp/rec 16
            PYTHONPATH=src python -m pipeline.raksil_games /tmp/rec upload "$2" "$3" "$D"
          fi
      - name: 20:00 몽글이 공감극장 밈 쇼츠 (화·토, 게임 쇼츠가 없는 날만)
        if: ${{ inputs.qid == '' || inputs.qid == null }}
        env:
          RAKSIL_YT_ENABLED: ${{ vars.RAKSIL_YT_ENABLED }}
          RAKSIL_MEME: ${{ vars.RAKSIL_MEME }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          RAKSIL_YT_REFRESH_TOKEN: ${{ secrets.RAKSIL_YT_REFRESH_TOKEN }}
        run: |
          [ "$RAKSIL_MEME" = off ] && { echo "밈 쇼츠 꺼짐 (RAKSIL_MEME=off)"; exit 0; }
          D="${{ inputs.date }}"; D="${D:-$(TZ=Asia/Seoul date +%F)}"
          GAME=$(PYTHONPATH=src python -m pipeline.raksil_games plan "$D")
          [ "$GAME" != none ] && { echo "오늘 20시는 게임 쇼츠($GAME) → 밈 쉼"; exit 0; }
          MEME=$(PYTHONPATH=src python -m pipeline.raksil_meme plan "$D")
          echo "오늘 20시 밈: $MEME"
          [ "$MEME" = none ] && exit 0
          export RAKSIL_FONT="$HOME/fonts/BlackHanSans-Regular.ttf"
          PYTHONPATH=src python -m pipeline.raksil_meme upload "$D"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raksil-short
          path: media/raksil/
          retention-days: 7
      - name: 틱톡용으로 보관 (릴리스 raksil-shorts, 최근 14개)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls media/raksil/*.mp4 >/dev/null 2>&1 || exit 0
          gh release view raksil-shorts >/dev/null 2>&1 || gh release create raksil-shorts --title "5락실 쇼츠 (틱톡 재업로드용)" --notes "매일 18:00 KST 자동 추가. 최근 14개만 보관. mp4 + 같은 이름 .txt(틱톡 설명)." --latest=false
          for j in media/raksil/*.json; do
            python -c "import json,sys;m=json.load(open(sys.argv[1]));g=('stage' in m or 'game' in m) and 'meme' not in m;print(m['title'].replace('#shorts','').strip()+'\n\n'+('몽글이 직접 키우기: 프로필 링크 5raksil.com\n#몽글이 #공감 #5락실' if m.get('meme') else '무료 웹게임 하기: 프로필 링크 5raksil.com\n#웹게임 #무료게임 #5락실' if g else '오늘의 밸런스게임 투표: 프로필 링크 5raksil.com\n#밸런스게임 #너라면 #5락실')+('\nAI 음성' if m.get('voiced') else ''))" "$j" > "${j%.json}.txt"
          done
          gh release upload raksil-shorts media/raksil/*.mp4 media/raksil/*.txt --clobber
          gh release view raksil-shorts --json assets -q '.assets[].name' | sort | grep -E '^[0-9]{4}-' | cut -c1-10 | sort -u | head -n -14 | while read d; do
            for a in $(gh release view raksil-shorts --json assets -q ".assets[].name" | grep "^$d"); do gh release delete-asset raksil-shorts "$a" -y; done
          done
      - name: 업로드 기록 저장
        if: always()
        run: |
          [ -f data/youtube/raksil_uploaded.json ] || exit 0
          git config user.name "raksil-bot"
          git config user.email "raksil-bot@users.noreply.github.com"
          F=data/youtube/raksil_uploaded.json
          U=$(git status --porcelain -- data/api_usage | awk '{print $2}' | grep '\.json$' | head -1)
          git diff --quiet -- "$F" && [ -z "$U" ] && exit 0
          cp "$F" /tmp/mine.json
          [ -n "$U" ] && cp "$U" /tmp/usage.json
          # 다른 실행이 먼저 기록을 푸시했으면 충돌 대신 두 기록을 합친다 (먼저 올라간 기록 우선).
          # Claude API 사용 장부(몽글이의 선택)도 같이: main 장부에 없는 줄만 덧붙인다.
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --hard FETCH_HEAD
            python -c "import json,sys;f=sys.argv[1];a=json.load(open(f));b=json.load(open('/tmp/mine.json'));[a.setdefault(k,v) for k,v in b.items()];json.dump(a,open(f,'w'),ensure_ascii=False,indent=1)" "$F"
            if [ -n "$U" ]; then
              python -c "import json,os,sys;f=sys.argv[1];a=json.load(open(f)) if os.path.exists(f) else [];b=json.load(open('/tmp/usage.json'));a+=[r for r in b if r not in a];os.makedirs(os.path.dirname(f),exist_ok=True);open(f,'w').write(json.dumps(a,ensure_ascii=False,indent=1)+'\n')" "$U"
              git add "$U"
            fi
            git add "$F"
            git commit -q -m "5락실 쇼츠 업로드 기록 $(TZ=Asia/Seoul date '+%F')" || exit 0
            git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
