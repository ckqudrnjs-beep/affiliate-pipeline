name: raksil-shorts

# 5락실 채널: 오늘의 밸런스게임 쇼츠를 매일 자동으로 만들어 바로 공개 업로드 (2026-11-13 BK 요청).
# 상품·협찬 없음 → 유료 프로모션 아님. AI 음성이면 합성 콘텐츠 표시 자동.
# 저장소 변수 RAKSIL_YT_ENABLED=true 전에는 만들기만 하고 영상은 Actions 아티팩트로만 남긴다.
on:
  schedule:
    - cron: "23 7 * * *"   # 16:23 KST 만들기 → 17:00 KST 공개 예약 (BK 11/13: 매일 오후 5시)
    - cron: "47 7 * * *"   # 16:47 KST 예비 (이미 올렸으면 건너뜀, 17시 지나면 바로 공개)
  workflow_dispatch:
    inputs:
      date:
        description: "날짜 YYYY-MM-DD (비우면 오늘)"
        required: false
        default: ""
      range:
        description: "true 면 네온 사격장 하이라이트도 (월·목이 아니어도)"
        required: false
        default: "false"
      qid:
        description: "추가 1편: 질문 id (예 20261113-2). 넣으면 그 질문으로 바로 공개, 매일 분과 따로 기록"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: main-writer
  cancel-in-progress: false

jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 준비
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q fonts-nanum ffmpeg
          pip install -q pillow numpy supertonic==1.3.1
          mkdir -p "$HOME/fonts"
          curl -sfL -o "$HOME/fonts/BlackHanSans-Regular.ttf" https://fonts.gstatic.com/s/blackhansans/v24/ea8Aad44WunzF9a-dL6toA8r8nqV.ttf || true
      - uses: actions/cache@v4
        with:
          path: ~/.cache/supertonic3
          key: supertonic-3-v1
      - name: 검사
        run: PYTHONPATH=src python -m unittest tests.test_raksil_shorts tests.test_raksil_range
      - name: 만들기 + 올리기
        env:
          RAKSIL_YT_ENABLED: ${{ vars.RAKSIL_YT_ENABLED }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          RAKSIL_YT_REFRESH_TOKEN: ${{ secrets.RAKSIL_YT_REFRESH_TOKEN }}
          RAKSIL_QID: ${{ inputs.qid }}
        run: |
          export RAKSIL_FONT="$HOME/fonts/BlackHanSans-Regular.ttf"
          PYTHONPATH=src python -m pipeline.raksil_shorts upload ${{ inputs.date }}
      - name: 게임 데이(월·목) 네온 사격장 하이라이트 → 20:00 공개
        if: ${{ inputs.qid == '' || inputs.qid == null }}
        env:
          RAKSIL_YT_ENABLED: ${{ vars.RAKSIL_YT_ENABLED }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          RAKSIL_YT_REFRESH_TOKEN: ${{ secrets.RAKSIL_YT_REFRESH_TOKEN }}
          FORCE: ${{ inputs.range }}
        run: |
          D="${{ inputs.date }}"; D="${D:-$(TZ=Asia/Seoul date +%F)}"
          DOW=$(date -d "$D" +%u)
          if [ "$FORCE" != "true" ] && [ "$DOW" != 1 ] && [ "$DOW" != 4 ]; then echo "게임 데이 아님"; exit 0; fi
          if grep -q "\"$D-range\"" data/youtube/raksil_uploaded.json 2>/dev/null; then echo "이미 올림"; exit 0; fi
          export RAKSIL_FONT="$HOME/fonts/BlackHanSans-Regular.ttf"
          (cd playground && PG_NO_STATS=1 python build.py /tmp/site >/dev/null)
          (cd /tmp/site && python -m http.server 8765 >/dev/null 2>&1 &)
          npm i --no-save --silent playwright@1.63.0 && npx playwright install --with-deps chromium >/dev/null
          STAGE=$(PYTHONPATH=src python -c "import datetime as d;from pipeline.raksil_range import stage_for;print(stage_for(d.date.fromisoformat('$D')))")
          node scripts/range_rec.js http://localhost:8765 /tmp/rec "$STAGE" 21
          PYTHONPATH=src python -m pipeline.raksil_range /tmp/rec upload "$D"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raksil-short
          path: media/raksil/
          retention-days: 7
      - name: 틱톡용으로 보관 (릴리스 raksil-shorts, 최근 14개)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls media/raksil/*.mp4 >/dev/null 2>&1 || exit 0
          gh release view raksil-shorts >/dev/null 2>&1 || gh release create raksil-shorts --title "5락실 쇼츠 (틱톡 재업로드용)" --notes "매일 18:00 KST 자동 추가. 최근 14개만 보관. mp4 + 같은 이름 .txt(틱톡 설명)." --latest=false
          for j in media/raksil/*.json; do
            python -c "import json,sys;m=json.load(open(sys.argv[1]));g='stage' in m;print(m['title'].replace('#shorts','').strip()+'\n\n'+('무료 웹게임 하기: 프로필 링크 5raksil.com\n#네온사격장 #웹게임 #5락실' if g else '오늘의 밸런스게임 투표: 프로필 링크 5raksil.com\n#밸런스게임 #너라면 #5락실')+('\nAI 음성' if m.get('voiced') else ''))" "$j" > "${j%.json}.txt"
          done
          gh release upload raksil-shorts media/raksil/*.mp4 media/raksil/*.txt --clobber
          gh release view raksil-shorts --json assets -q '.assets[].name' | sort | grep -E '^[0-9]{4}-' | cut -c1-10 | sort -u | head -n -14 | while read d; do
            for a in $(gh release view raksil-shorts --json assets -q ".assets[].name" | grep "^$d"); do gh release delete-asset raksil-shorts "$a" -y; done
          done
      - name: 업로드 기록 저장
        if: always()
        run: |
          [ -f data/youtube/raksil_uploaded.json ] || exit 0
          git config user.name "raksil-bot"
          git config user.email "raksil-bot@users.noreply.github.com"
          git add data/youtube/raksil_uploaded.json
          git commit -m "5락실 쇼츠 업로드 기록 $(TZ=Asia/Seoul date '+%F')" || exit 0
          git pull --rebase -q origin main
          git push origin HEAD:main
