name: episodes

# 새 기획 영상 만들기 (2026-11-11 BK 확정, plan/YOUTUBE_PLAN.md, docs/EPISODES.md)
# Claude 예약 작업이 data/episodes/<날짜>-<형식>.json 대본을 main 에 올리면 영상을 만든다 (무료).
# - 쇼츠: 만들어서 main 에 바로 올림 → youtube 워크플로가 그 날짜 19:00 으로 업로드
# - 롱폼: 미리보기 PR → BK가 보고 병합하면 업로드 (20:00)
on:
  push:
    branches: [main]
    paths: ["data/episodes/*.json"]
  schedule:
    - cron: "10 21 * * 1,4"   # 화·금 06:10 KST: 오늘의 얼마게 (05:50 시세 수집 뒤, 사이트 퀴즈와 같은 문제)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: main-writer
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 준비
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q fonts-nanum ffmpeg
          pip install -q pillow numpy supertonic==1.3.1
      - uses: actions/cache@v4
        with:
          path: ~/.cache/supertonic3
          key: supertonic-3-v1
      - name: 검사
        run: PYTHONPATH=src python -m unittest discover -s tests
      - name: 쇼츠 만들기 → main
        env:
          EP_KIND: short
        run: |
          git pull -q origin main
          PYTHONPATH=src python -m pipeline.episodes quiz
          PYTHONPATH=src python -m pipeline.episodes render
          git config user.name "episodes-bot"
          git config user.email "episodes-bot@users.noreply.github.com"
          git add media/youtube data/episodes video_assets
          git commit -m "쇼츠 영상 $(TZ=Asia/Seoul date +%F)" || exit 0
          git pull --rebase -q origin main
          git push origin HEAD:main
      - name: 롱폼 만들기 → 미리보기 PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch -q origin main && git checkout -q -B work origin/main
          for f in $(PYTHONPATH=src python -c "from pipeline.episodes import unrendered;import json;[print(p) for p in unrendered() if json.load(open(p)).get('kind')=='long']"); do
            stem=$(basename "$f" .json); b="longform/$stem"
            if git ls-remote --exit-code --heads origin "$b" >/dev/null; then echo "$b 이미 있음"; continue; fi
            git checkout -q -B "$b" origin/main
            PYTHONPATH=src python -m pipeline.episodes render "$f"
            git add media/youtube data/episodes video_assets
            git commit -q -m "롱폼 미리보기 $stem"
            git push -q -u origin "$b"
            gh pr create --base main --head "$b" --title "[롱폼] $stem" \
              --body "롱폼 영상(media/youtube/)을 내려받아 확인하고, 괜찮으면 병합하세요. 병합하면 대본 날짜 20:00 KST 로 업로드됩니다 (상품 편은 비공개로 올라가 유료 프로모션 체크 후 공개)."
          done
