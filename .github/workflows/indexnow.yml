# 새·바뀐 페이지를 네이버(서치어드바이저)·빙에 IndexNow 로 알린다. 비밀 필요 없음(키 파일은 공개용).
# 5락실(BK 2026-11-22): main 에 게임·공략이 들어오면 배포(2~4분)를 기다렸다가 새 주소만 보낸다.
# 돈줍는삼촌 don3chon(BK 2026-11-28 '사이트 색인작업'): 매일 06:40 KST(05:00 글·05:50 시세 배포 뒤) 새 글·고친 글 주소만 보낸다.
# 구글은 IndexNow 를 받지 않는다 → 서치콘솔 사이트맵(이미 제출)으로 간다.
name: indexnow
on:
  push:
    branches: [main]
    paths: ["playground/games/**", "playground/guides/**", "playground/static/*.txt", "static/*.txt"]
  schedule:
    - cron: "40 21 * * *"   # 매일 06:40 KST
  workflow_dispatch:
    inputs:
      all:
        description: "사이트맵 전체 보내기"
        type: boolean
        default: false
      site:
        description: "어느 사이트"
        type: choice
        options: [both, 5raksil, don3chon]
        default: both
concurrency: { group: indexnow, cancel-in-progress: false }
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/cache/restore@v4
        with:
          path: |
            .indexnow-seen.txt
            .indexnow-seen-don3chon.txt
          key: indexnow-seen-${{ github.run_id }}
          restore-keys: indexnow-seen-
      - name: 바뀐 파일
        id: ch
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "files=$(git diff --name-only HEAD~1 HEAD -- playground | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          fi
      - name: 5락실 IndexNow
        if: ${{ inputs.site != 'don3chon' }}
        continue-on-error: true
        run: python scripts/indexnow.py --site 5raksil --seen .indexnow-seen.txt ${{ inputs.all && '--all' || '' }} --changed ${{ steps.ch.outputs.files }}
      - name: 삼촌(don3chon) IndexNow
        if: ${{ inputs.site != '5raksil' }}
        run: python scripts/indexnow.py --site don3chon --seen .indexnow-seen-don3chon.txt ${{ inputs.all && '--all' || '' }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            .indexnow-seen.txt
            .indexnow-seen-don3chon.txt
          key: indexnow-seen-${{ github.run_id }}
