name: music-channel

# BEEKAY SONGS 노래 채널 (BK 2026-11-21): 드라이브 'BEEKAY SONGS' 의 새 Suno 곡 1개 →
# 커버 영상(전곡) + 후렴 쇼츠 40초 → 업로드. 코드 pipeline.music_channel, 설정 config/music_channel.json, 문서 docs/MUSIC_CHANNEL.md
# 저장소 변수 MUSIC_YT_ENABLED=true 가 아니면 만들기만 하고 아티팩트로 남긴다. 멈추려면 config on=false.
on:
  schedule:
    - cron: "13 1 * * 2,5"   # 화·금 10:13 KST (19:00 공개 예약 전에 끝나게)
  workflow_dispatch:
    inputs:
      lyrics_fid:
        description: "뮤비용 가사 시간만 뽑기 (드라이브 파일 id). 비우면 평소처럼 만들기+올리기"
        required: false
        default: ""
      mv_fid:
        description: "뮤직비디오 만들어 올리기 (드라이브 파일 id, config releases[id].mv)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: main-writer
  cancel-in-progress: false

jobs:
  music:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: 최신 main 받기
        if: github.ref == 'refs/heads/main'
        run: git fetch -q origin main && git reset -q --hard FETCH_HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 준비
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-inter
          pip install -q pillow numpy faster-whisper
      - name: 검사
        run: PYTHONPATH=src python -m unittest tests.test_music_channel
      - name: 뮤비용 가사 시간 (업로드 없음)
        if: inputs.lyrics_fid != ''
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          MUSIC_DRIVE_REFRESH_TOKEN: ${{ secrets.MUSIC_DRIVE_REFRESH_TOKEN }}
        run: PYTHONPATH=src python -m pipeline.music_channel lyrics --fid "${{ inputs.lyrics_fid }}"
      - name: 뮤직비디오 만들기 + 올리기
        if: inputs.mv_fid != '' && inputs.mv_fid != null
        env:
          MUSIC_YT_ENABLED: ${{ vars.MUSIC_YT_ENABLED }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          MUSIC_YT_REFRESH_TOKEN: ${{ secrets.MUSIC_YT_REFRESH_TOKEN }}
          MUSIC_DRIVE_REFRESH_TOKEN: ${{ secrets.MUSIC_DRIVE_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ vars.TELEGRAM_ADMIN_CHAT_ID }}
        run: PYTHONPATH=src python -m pipeline.music_channel mv --fid "${{ inputs.mv_fid }}"
      - name: 만들기 + 올리기
        if: (inputs.lyrics_fid == '' || inputs.lyrics_fid == null) && (inputs.mv_fid == '' || inputs.mv_fid == null)
        env:
          MUSIC_YT_ENABLED: ${{ vars.MUSIC_YT_ENABLED }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          MUSIC_YT_REFRESH_TOKEN: ${{ secrets.MUSIC_YT_REFRESH_TOKEN }}
          MUSIC_DRIVE_REFRESH_TOKEN: ${{ secrets.MUSIC_DRIVE_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}  # 업로드 알림 (밤 23~07시는 무음)
          TELEGRAM_ADMIN_CHAT_ID: ${{ vars.TELEGRAM_ADMIN_CHAT_ID }}
        run: PYTHONPATH=src python -m pipeline.music_channel run
      - uses: actions/upload-artifact@v4
        if: always() && !inputs.lyrics_fid && !inputs.mv_fid
        with:
          name: music-channel
          path: |
            media/music/*.mp4
            media/music/*.jpg
            media/music/last.json
          retention-days: 14
          if-no-files-found: ignore
      - name: 업로드 기록 저장
        if: always() && !inputs.lyrics_fid
        run: |
          F=data/music/uploaded.json
          [ -f "$F" ] || exit 0
          git config user.name "music-bot"
          git config user.email "music-bot@users.noreply.github.com"
          cp "$F" /tmp/mine.json
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --hard FETCH_HEAD
            mkdir -p "$(dirname "$F")"
            python -c "import json,os,sys;f=sys.argv[1];a=json.load(open(f)) if os.path.exists(f) else {};b=json.load(open('/tmp/mine.json'));n=lambda v:len(v.get('extras',[])) if isinstance(v,dict) else 0;[a.__setitem__(k,v) for k,v in b.items() if k not in a or n(v)>n(a[k])];json.dump(a,open(f,'w'),ensure_ascii=False,indent=1)" "$F"
            git add "$F"
            git commit -q -m "BEEKAY SONGS 업로드 기록 $(TZ=Asia/Seoul date '+%F')" || exit 0
            git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
