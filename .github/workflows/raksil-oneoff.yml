name: raksil-oneoff

# 5락실 한 편 수동 업로드 (BK 11/21 "올려"): oneoff/*.json 메타 + mp4 를 그대로 올린다. 브랜치 시험용.
on:
  push:
    branches: [claude/project-thread-jydap3]
    paths: ["oneoff/*.json"]

permissions:
  contents: read

jobs:
  up:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 올리기
        env:
          RAKSIL_YT_ENABLED: ${{ vars.RAKSIL_YT_ENABLED }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          RAKSIL_YT_REFRESH_TOKEN: ${{ secrets.RAKSIL_YT_REFRESH_TOKEN }}
        run: |
          for f in oneoff/*.json; do
            PYTHONPATH=src python -c "import json,sys; from pipeline import raksil_shorts as rs; sys.exit(rs.upload_meta(json.load(open('$f'))))"
          done
          cat data/youtube/raksil_uploaded.json | tail -12
