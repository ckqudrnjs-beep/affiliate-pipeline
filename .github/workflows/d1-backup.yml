name: d1-backup

# 5락실 데이터(D1 5raksil-db) 주간 백업 (2026-11-15 BK, plan/SECURITY.md C).
# 매주 일요일 04:20 KST 에 전체를 SQL 로 내보내 **암호화한 뒤** 작업 결과물(Artifacts)로 90일 보관한다.
# 이 저장소는 공개라서 결과물을 누구나 받을 수 있다 → 평문은 절대 올리지 않고 AES256 암호화 파일만 올린다(2026-11-18).
# 안에는 별명·복구 코드 해시·게시판 글(비밀글 포함)이 있다. 원본 IP·이메일·전화번호는 없다.
# 필요(BK가 GitHub Secrets 에 직접 등록):
#   CF_D1_TOKEN        Cloudflare API 토큰(권한 'D1: Edit' 하나만)
#   BACKUP_PASSPHRASE  백업 암호(20자 이상 무작위, 비밀번호 관리자에도 따로 보관. 잃어버리면 백업을 못 연다)
#   Variable CF_ACCOUNT_ID(이미 있음)
# 복원: Artifacts 에서 받은 .gpg 를 Claude 에게 요청(되돌리기 전에 BK 확인).
#   풀기: gpg --decrypt 5raksil-db-날짜.sql.gz.gpg > x.sql.gz  (암호 입력)
on:
  schedule:
    - cron: "20 19 * * 6"   # 일 04:20 KST (접속 적은 시간)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 설정 확인
        env:
          T: ${{ secrets.CF_D1_TOKEN }}
          P: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$T" ]; then echo "::error::Secret CF_D1_TOKEN 이 없어요."; exit 1; fi
          if [ ${#P} -lt 16 ]; then echo "::error::Secret BACKUP_PASSPHRASE 가 없거나 너무 짧아요(16자 이상). 공개 저장소라 암호 없이는 백업을 올리지 않아요."; exit 1; fi
      - name: 내보내기 + 암호화
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_D1_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          P: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          d=$(TZ=Asia/Seoul date +%F)
          mkdir -p "$RUNNER_TEMP/d1" out
          f="$RUNNER_TEMP/d1/5raksil-db-$d.sql"
          npx --yes wrangler@4.20.0 d1 export 5raksil-db --remote --output "$f" > /dev/null
          test -s "$f"
          gzip -9 "$f"
          printf '%s' "$P" | gpg --batch --yes --quiet --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 -o "out/5raksil-db-$d.sql.gz.gpg" "$f.gz"
          rm -rf "$RUNNER_TEMP/d1"
          # 암호화 확인: 평문 SQL 흔적이 없어야 함
          if zcat -f "out/5raksil-db-$d.sql.gz.gpg" 2>/dev/null | grep -q "CREATE TABLE"; then echo "::error::암호화 실패"; exit 1; fi
          ls -l out
      - uses: actions/upload-artifact@v7
        with:
          name: d1-5raksil-db-encrypted
          path: out/*.gpg
          retention-days: 90
          if-no-files-found: error
