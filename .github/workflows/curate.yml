name: curate

on:
  schedule:
    - cron: "30 21 * * *"   # 매일 06:30 KST
  workflow_dispatch:
    inputs:
      keywords:
        description: "이번만 쓸 검색어(쉼표 구분). 넣으면 후보만 모아 브랜치에 올리고 가격·main은 건드리지 않음"
        required: false
        default: ""
      count:
        description: "후보 개수"
        required: false
        default: "15"

permissions:
  contents: write

concurrency:
  group: main-writer
  cancel-in-progress: false

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: PYTHONPATH=src python -m unittest discover -s tests
      - name: 알리 후보 수집 + 가격 기록
        env:
          ALI_APP_KEY: ${{ secrets.ALI_APP_KEY }}
          ALI_APP_SECRET: ${{ secrets.ALI_APP_SECRET }}
          ALI_TRACKING_ID: ${{ secrets.ALI_TRACKING_ID }}
          ALI_KEYWORDS: ${{ inputs.keywords || vars.ALI_KEYWORDS }}
          CANDIDATES_ONLY: ${{ inputs.keywords }}
          CURATE_K: ${{ inputs.count || '15' }}
          CURATE_MAX_KW: ${{ inputs.keywords && '30' || '12' }}
        run: PYTHONPATH=src python -m pipeline.curate
      - name: 텔레그램 가격 알림 (TELEGRAM_ENABLED=true 일 때만 실제 전송)
        if: ${{ !inputs.keywords }}
        env:
          TELEGRAM_ENABLED: ${{ vars.TELEGRAM_ENABLED }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: PYTHONPATH=src python -m pipeline.telegram || echo "텔레그램 전송 실패(가격 기록은 계속 커밋)"
      - name: 수동 검색어 후보는 브랜치에만 올림
        if: ${{ inputs.keywords }}
        run: |
          b=candidates/$(TZ=Asia/Seoul date +%F-%H%M)
          git config user.name "curate-bot"
          git config user.email "curate-bot@users.noreply.github.com"
          git checkout -b "$b"
          git add data/candidates
          git commit -m "수동 검색어 후보 $b"
          git push -u origin "$b"
      - name: 가격·판매 상태·새 후보를 main에 바로 기록 (사이트 자동 재배포, 후보는 사이트에 안 보임)
        if: ${{ !inputs.keywords }}
        run: |
          git config user.name "curate-bot"
          git config user.email "curate-bot@users.noreply.github.com"
          git add data/prices data/products data/news.json data/candidates
          [ -f data/telegram_sent.json ] && git add data/telegram_sent.json
          git commit -m "알리 가격·판매 상태·후보 갱신 $(TZ=Asia/Seoul date +%F)" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
