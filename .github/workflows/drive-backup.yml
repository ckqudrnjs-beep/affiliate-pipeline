name: drive-backup

# 만든 영상·이미지를 BK 구글 드라이브에 자동 백업 (2026-11-19). 매일 03:30 KST.
# 저장소 git 기록 전체의 결과물(쇼츠·AI 클립·포스터·사이트 이미지·웹툰·인스타) + 5락실 쇼츠 릴리스(최근 14개만 남음)를
# 드라이브 "자동 백업 (돈삼촌·5락실)/<종류>/<YYYY-MM>/" 에 올린다. 이미 올린 것은 건너뛴다. 저장소에는 아무것도 쓰지 않는다.
# 설정: docs/DRIVE_BACKUP.md (DRIVE_REFRESH_TOKEN 없으면 목록만 보여 주고 끝). 멈추려면 저장소 변수 DRIVE_BACKUP=off.
on:
  schedule:
    - cron: "30 18 * * *"   # 03:30 KST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drive-backup
  cancel-in-progress: false

jobs:
  backup:
    if: vars.DRIVE_BACKUP != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # 지워진 옛 파일도 git 기록에서 찾아 올린다
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 5락실 쇼츠 릴리스 내려받기
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download raksil-shorts -p "*.mp4" -D "$RUNNER_TEMP/raksil" 2>/dev/null || echo "릴리스 없음"
      - name: 드라이브에 올리기
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
        run: PYTHONPATH=src python -m pipeline.drive_backup --extra "$RUNNER_TEMP/raksil:쇼츠-5락실"
