name: gsc-stats

# 서치콘솔 읽기 전용 수집 (2026-11-16). 매일 07:20 KST, 클릭·노출·검색어·사이트맵 색인 수를
# data/seo/gsc.json 에 쌓고 docs/SEO_WEEKLY.md 를 새로 만든다. 사이트 설정은 바꾸지 않는다.
on:
  schedule:
    - cron: "20 22 * * *"   # 07:20 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-writer
  cancel-in-progress: false

jobs:
  gsc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 수집
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
        run: |
          PYTHONPATH=src python -m pipeline.gsc_stats
          [ -f docs/SEO_WEEKLY.md ] && head -12 docs/SEO_WEEKLY.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: 저장
        run: |
          git config user.name "gsc-stats-bot"
          git config user.email "gsc-stats-bot@users.noreply.github.com"
          git add data/seo/gsc.json docs/SEO_WEEKLY.md 2>/dev/null || true
          git commit -m "서치콘솔 현황 $(TZ=Asia/Seoul date +%F)" || exit 0
          git pull --rebase -q origin main
          git push origin HEAD:main
