name: daily-drafts

on:
  # 2026-11-13 BK: 매일 초안 PR은 쓰지 않아 자동 실행을 끔(블로그는 주말 수동, 인스타는 스레드에서 준비). 필요하면 손으로 실행.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: main-writer   # 발행 기록 커밋과 겹치지 않게
  cancel-in-progress: false

jobs:
  drafts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: PYTHONPATH=src python -m unittest discover -s tests
      - name: Generate drafts
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          COUPANG_SUB_ID: sns
          ALI_APP_KEY: ${{ secrets.ALI_APP_KEY }}
          ALI_APP_SECRET: ${{ secrets.ALI_APP_SECRET }}
          ALI_TRACKING_ID: ${{ secrets.ALI_TRACKING_ID }}
          ALI_KEYWORDS: ${{ vars.ALI_KEYWORDS }}
        run: PYTHONPATH=src python -m pipeline.drafts
      - name: Open review PR (블로그·수동 게시용 초안, 자동 게시 없음)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          d=$(TZ=Asia/Seoul date +%F)
          [ -f drafts/blog/$d.md ] || [ -f drafts/manual/$d.md ] || { echo "초안 없음"; exit 0; }
          git config user.name "drafts-bot"
          git config user.email "drafts-bot@users.noreply.github.com"
          # 2026-11-08 결정: SNS 자동 게시 중단. 초안은 drafts/blog/, drafts/manual/ 에만 쓰므로 병합해도 게시되지 않는다.
          b=drafts/$d
          git ls-remote --exit-code --heads origin "$b" >/dev/null && b=drafts/$d-$(TZ=Asia/Seoul date +%H%M)
          if grep -qs "⛔" drafts/blog/$d.md drafts/manual/$d.md; then tag="검토 필요: 차단 항목 있음"; else tag="초안"; fi
          git checkout -b "$b"
          git add drafts/
          git commit -m "초안 $d ($tag)" || exit 0
          git push -u origin "$b"
          { echo "블로그 글 초안과 스레드·인스타 수동 게시용 글입니다. **자동으로 게시되지 않습니다.**"
            echo "블로그 글은 괄호 안 안내를 채워 직접 올리고, 정보형 글은 앱에서 직접 올리세요. 병합은 기록용입니다."
            for f in drafts/blog/$d.md drafts/manual/$d.md; do [ -f "$f" ] && { echo; cat "$f"; }; done; } > /tmp/body.md
          gh pr create --title "[$tag] 블로그·수동 게시 초안 $d" --body-file /tmp/body.md --base main
