name: daily-drafts

on:
  schedule:
    - cron: "0 22 * * *"   # 매일 07:00 KST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: main-writer   # 발행 기록 커밋과 겹치지 않게
  cancel-in-progress: false

jobs:
  drafts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: PYTHONPATH=src python -m unittest discover -s tests
      - name: Generate drafts
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          COUPANG_SUB_ID: sns
        run: PYTHONPATH=src python -m pipeline.drafts
      - name: Auto-approve or open review PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          d=$(TZ=Asia/Seoul date +%F)
          f=drafts/$d.md
          [ -f "$f" ] || { echo "초안 없음"; exit 0; }
          git config user.name "drafts-bot"
          git config user.email "drafts-bot@users.noreply.github.com"
          if grep -q "⛔" "$f"; then
            # 검사 실패 항목이 있으면 사용자 검토용 PR
            git checkout -b drafts/$d
            git add drafts/
            git commit -m "SNS 초안 $d (검토 필요)"
            git push -u origin drafts/$d
            gh pr create --title "[검토 필요] SNS 초안 $d" --body "준수 검사에서 차단된 초안이 있습니다. 고친 뒤 머지하세요." --base main
          else
            # 모든 초안이 검사를 통과하면 자동 승인(main에 바로 반영)
            git add drafts/
            git commit -m "SNS 초안 $d (자동 승인)" || exit 0
            git push origin HEAD:main
          fi
