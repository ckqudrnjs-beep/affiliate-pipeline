name: daily-drafts

on:
  schedule:
    - cron: "0 22 * * *"   # 매일 07:00 KST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: main-writer   # 발행 기록 커밋과 겹치지 않게
  cancel-in-progress: false

jobs:
  drafts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: PYTHONPATH=src python -m unittest discover -s tests
      - name: Generate drafts
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          COUPANG_SUB_ID: sns
          ALI_APP_KEY: ${{ secrets.ALI_APP_KEY }}
          ALI_APP_SECRET: ${{ secrets.ALI_APP_SECRET }}
          ALI_TRACKING_ID: ${{ secrets.ALI_TRACKING_ID }}
          ALI_KEYWORDS: ${{ vars.ALI_KEYWORDS }}
        run: PYTHONPATH=src python -m pipeline.drafts
      - name: Open review PR (every draft needs user approval)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          d=$(TZ=Asia/Seoul date +%F)
          f=drafts/$d.md
          [ -f "$f" ] || { echo "초안 없음"; exit 0; }
          git config user.name "drafts-bot"
          git config user.email "drafts-bot@users.noreply.github.com"
          # 2026-11-07 결정: 검사 통과 여부와 관계없이 모든 초안은 사용자가 PR을 병합해야 게시된다.
          # 발행기는 오늘·어제 초안만 올리므로, 다음 날까지 병합하지 않으면 그 초안은 게시되지 않는다.
          if grep -q "⛔" "$f"; then tag="검토 필요: 차단 항목 있음"; else tag="검토 요청"; fi
          git checkout -b drafts/$d
          git add drafts/
          git commit -m "SNS 초안 $d ($tag)" || exit 0
          git push -u origin drafts/$d
          { echo "인스타·스레드에 올라갈 초안입니다. 내용을 확인하고 **병합하면 게시 대기열에 들어갑니다.**"
            echo "고칠 글은 이 PR에서 파일을 수정하거나, 빼고 싶은 초안 섹션을 지운 뒤 병합하세요. ⛔ 표시 초안은 발행기가 건너뜁니다."
            echo "오늘·내일 안에 병합하지 않으면 이 초안은 게시되지 않습니다."
            echo; cat "$f"; } > /tmp/body.md
          gh pr create --title "[$tag] SNS 초안 $d" --body-file /tmp/body.md --base main
