name: yt-comment-cleanup

# 11/24 BK '비케이요 돈삼촌이 댓글을 달았어 안돼': 잘못된 채널 이름으로 단 첫 댓글 지우기 + 토큰별 채널 이름 확인. 손으로만 실행.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-writer
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 정리
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          RAKSIL_YT_REFRESH_TOKEN: ${{ secrets.RAKSIL_YT_REFRESH_TOKEN }}
          MUSIC_YT_REFRESH_TOKEN: ${{ secrets.MUSIC_YT_REFRESH_TOKEN }}
        run: PYTHONPATH=src python -m pipeline.first_comment cleanup | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 저장
        run: |
          git config user.name "yt-stats-bot"
          git config user.email "yt-stats-bot@users.noreply.github.com"
          git add data/youtube/first_comments.json
          git commit -m "첫 댓글 정리 $(TZ=Asia/Seoul date +%F)" || exit 0
          git pull --rebase -q origin main
          git push origin HEAD:main
