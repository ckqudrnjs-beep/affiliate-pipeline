name: gate-check
# 기획안 채점만 (영상·업로드 없음). 이 브랜치에 plan_gate/*.txt 를 올리면 그 기획을 3번 채점해 로그에 남긴다 (11/21 BK).
on:
  push:
    branches: ["claude/project-thread-jydap3"]
    paths: ["plan_gate/**", "scripts/gate_check.py"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pillow numpy "anthropic>=2.11,<3"
      - name: 채점
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: for f in plan_gate/*.txt; do echo "== $f"; PYTHONPATH=src python scripts/gate_check.py "$f" 3; done
