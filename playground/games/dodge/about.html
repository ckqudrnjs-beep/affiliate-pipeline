<section class="gabout"><h2>이 게임은</h2>
<p>별똥별 피하기는 하늘에서 떨어지는 별똥별을 좌우로 피하며 오래 버티는 게임입니다. 휴대폰에서는 화면을 누른 채 좌우로 끌고, 컴퓨터에서는 ← → 키로 움직여요. 버틴 시간 1초마다 10점, 노란 별을 먹으면 50점이 더해지고, 10초마다 속도 단계가 올라갑니다.</p>
<p>처음 하는 분은 화면 끝으로 몰리다가 양쪽에서 막히는 경우가 많아요. 가운데 근처에 머물면서 우주선보다 조금 위쪽을 보면 피할 길이 먼저 보입니다. 오늘은 모두 같은 순서로 별똥별이 떨어지니, 몇 번 하다 보면 위험한 장면을 미리 알고 피할 수 있어요.</p></section>
